[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lavanya-quiz-backend"
version = "0.1.0"
description = "Backend for Proctored RAG Quiz System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "argon2-cffi>=23.1",
    "python-jose[cryptography]>=3.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "email-validator>=2.0",
    "slowapi>=0.1.9",
    "httpx>=0.27",
    "sentence-transformers>=2.7",
    "openai>=1.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "BLE001"]

